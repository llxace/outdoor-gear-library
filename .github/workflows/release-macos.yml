name: Build and publish macOS download

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Archive universal macOS app
        run: |
          xcodebuild \
            -project "户外装备库.xcodeproj" \
            -scheme OutdoorGear \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "$RUNNER_TEMP/OutdoorGear.xcarchive" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package app and checksums
        run: |
          APP_PATH="$RUNNER_TEMP/OutdoorGear.xcarchive/Products/Applications/户外装备库.app"
          DIST_DIR="$RUNNER_TEMP/release"
          DMG_STAGE="$RUNNER_TEMP/dmg-stage"
          test -d "$APP_PATH"
          mkdir -p "$DIST_DIR" "$DMG_STAGE"

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" "$DIST_DIR/outdoor-gear-library-macos.zip"

          ditto "$APP_PATH" "$DMG_STAGE/户外装备库.app"
          ln -s /Applications "$DMG_STAGE/应用程序"
          hdiutil create \
            -volname "徒步装备库" \
            -srcfolder "$DMG_STAGE" \
            -ov \
            -format UDZO \
            "$DIST_DIR/outdoor-gear-library-macos.dmg"

          (
            cd "$DIST_DIR"
            shasum -a 256 outdoor-gear-library-macos.dmg outdoor-gear-library-macos.zip > SHA256SUMS.txt
          )

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="$GITHUB_REF_NAME"
          ASSETS=(
            "$RUNNER_TEMP/release/outdoor-gear-library-macos.dmg"
            "$RUNNER_TEMP/release/outdoor-gear-library-macos.zip"
            "$RUNNER_TEMP/release/SHA256SUMS.txt"
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "徒步装备库 $TAG" \
              --notes "macOS 13+ 通用版（Apple silicon 与 Intel）。本构建未使用 Developer ID 签名或 Apple 公证；首次打开时，请在 Finder 中按住 Control 点按应用，选择“打开”。源码与许可见仓库 README。"
          fi
